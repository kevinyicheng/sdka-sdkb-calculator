<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富邦 SDKA/SDKB 重大傷病險保費試算</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d17;
  --s1:rgba(255,255,255,.04);
  --s2:rgba(255,255,255,.07);
  --b1:rgba(255,255,255,.08);
  --b2:rgba(255,255,255,.16);
  --tx:#eef0f8;
  --mu:rgba(255,255,255,.38);
  --cyan:#4fd1c5;
  --green:#68d391;
  --amber:#f6ad55;
  --purple:#b794f4;
  --blue:#63b3ed;
  --red:#fc8181;
  --c1:#63b3ed;--c2:#68d391;--c3:#f6ad55;
}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 15% 5%,rgba(79,209,197,.1) 0%,transparent 55%),
    radial-gradient(ellipse 55% 70% at 85% 85%,rgba(99,179,237,.09) 0%,transparent 55%),
    radial-gradient(ellipse 45% 45% at 55% 45%,rgba(183,148,244,.05) 0%,transparent 65%);
}

/* ── Page ── */
.page{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 20px 100px}

/* ── Header ── */
header{display:flex;align-items:center;justify-content:space-between;padding-bottom:36px}
.logo{display:flex;align-items:center;gap:14px}
.logo-mark{
  width:44px;height:44px;border-radius:13px;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:#0b0d17;letter-spacing:-.5px;
  box-shadow:0 0 24px rgba(79,209,197,.3);
}
.logo-info strong{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.logo-info span{font-size:12px;color:var(--mu)}
.badge{
  padding:6px 16px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;
  background:rgba(79,209,197,.1);border:1px solid rgba(79,209,197,.25);color:var(--cyan);
}

/* ── Glass Card ── */
.card{
  background:var(--s1);border:1px solid var(--b1);
  border-radius:24px;padding:32px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.card+.card,.card+.results{margin-top:16px}
.section-label{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mu);margin-bottom:24px;
}

/* ── Gender Pills ── */
.gender-row{display:flex;gap:10px;margin-bottom:28px}
.g-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:18px 12px;border:1px solid var(--b1);border-radius:16px;
  cursor:pointer;transition:all .2s;background:var(--s1);
  font-size:16px;font-weight:600;color:var(--mu);
}
.g-btn input{display:none}
.g-btn .g-icon{font-size:22px;line-height:1}
.g-btn:hover{border-color:var(--b2);color:var(--tx);background:var(--s2)}
.g-btn.male-on{border-color:rgba(99,179,237,.55);background:rgba(99,179,237,.1);color:var(--c1)}
.g-btn.female-on{border-color:rgba(183,148,244,.55);background:rgba(183,148,244,.1);color:var(--purple)}

/* ── Date Row ── */
.field-label{font-size:12px;color:var(--mu);font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.date-row{display:flex;gap:10px;margin-bottom:28px}
.date-row input,.date-row select{
  background:rgba(255,255,255,.05);border:1px solid var(--b1);
  border-radius:14px;color:var(--tx);font-size:15px;padding:14px 16px;
  outline:none;transition:border-color .2s,background .2s;
  appearance:none;-webkit-appearance:none;width:100%;
}
.date-row input:focus,.date-row select:focus{border-color:var(--b2);background:rgba(255,255,255,.08)}
.date-row input::placeholder{color:rgba(255,255,255,.18)}
.date-row input::-webkit-inner-spin-button{display:none}
.date-row select option{background:#15172a}
.yr{flex:1.6}.mo,.dy{flex:1}

#age-tag{
  display:none;align-items:center;gap:8px;margin-top:12px;margin-bottom:28px;
  font-size:15px;font-weight:600;color:var(--cyan);
}
#age-tag.on{display:flex}
#age-tag::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--cyan);flex-shrink:0;box-shadow:0 0 8px var(--cyan)}

/* ── Coverage Slider ── */
.coverage-section{margin-bottom:8px}
.coverage-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.coverage-big{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--tx)}
.coverage-big .unit{font-size:20px;font-weight:600;color:var(--mu);margin-left:4px}
.coverage-input-wrap{position:relative}
.coverage-input{
  background:transparent;border:none;outline:none;
  font-size:48px;font-weight:800;letter-spacing:-.03em;color:var(--tx);
  width:160px;text-align:right;
}
.coverage-input::-webkit-inner-spin-button{display:none}

/* Custom Range Slider */
.slider-wrap{position:relative;margin-bottom:8px}
input[type=range]{
  width:100%;height:6px;appearance:none;-webkit-appearance:none;
  border-radius:999px;outline:none;cursor:pointer;
  background:linear-gradient(to right, var(--cyan) 0%, var(--cyan) var(--pct,20%), rgba(255,255,255,.1) var(--pct,20%));
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;-webkit-appearance:none;
  width:26px;height:26px;border-radius:50%;
  background:#fff;cursor:grab;
  box-shadow:0 0 0 4px rgba(79,209,197,.3), 0 4px 12px rgba(0,0,0,.4);
  transition:box-shadow .2s;
}
input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;box-shadow:0 0 0 8px rgba(79,209,197,.2),0 4px 12px rgba(0,0,0,.4)}
.slider-ticks{display:flex;justify-content:space-between;margin-top:8px}
.slider-tick{font-size:11px;color:var(--mu);font-weight:500}

/* ── Calc Button ── */
.calc-btn{
  width:100%;padding:20px;margin-top:8px;
  background:linear-gradient(135deg,rgba(79,209,197,.18),rgba(99,179,237,.15));
  border:1px solid rgba(79,209,197,.3);border-radius:16px;
  color:var(--cyan);font-size:17px;font-weight:800;letter-spacing:.04em;
  cursor:pointer;transition:all .2s;
}
.calc-btn:hover{background:linear-gradient(135deg,rgba(79,209,197,.28),rgba(99,179,237,.25));border-color:rgba(79,209,197,.55);transform:translateY(-2px);box-shadow:0 8px 32px rgba(79,209,197,.15)}
.calc-btn:active{transform:translateY(0)}
#err{display:none;margin-top:14px;font-size:14px;color:var(--red);text-align:center}
#err.on{display:block}

/* ── Results ── */
.results{display:none}
.results.on{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── Hero ── */
.hero{
  background:linear-gradient(135deg,rgba(79,209,197,.1),rgba(99,179,237,.07));
  border:1px solid rgba(79,209,197,.18);border-radius:24px;padding:32px;margin-bottom:16px;
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.hero-who{font-size:15px;font-weight:600;color:var(--cyan);margin-top:4px}
.hero-label{font-size:11px;color:var(--mu);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.hero-big{font-size:52px;font-weight:900;letter-spacing:-.03em;line-height:1}
.hero-big .cur{font-size:26px;font-weight:600;color:var(--mu);margin-right:2px}
.hero-meta{font-size:13px;color:var(--mu);text-align:right;line-height:2}
.hero-meta strong{color:var(--tx)}

/* ── Timeline Bar ── */
.timeline{margin-top:4px}
.tl-label{font-size:11px;color:var(--mu);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.tl-track{
  display:flex;border-radius:12px;overflow:hidden;height:36px;
  background:rgba(255,255,255,.04);border:1px solid var(--b1);
}
.tl-seg{
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;letter-spacing:.05em;
  transition:flex .5s cubic-bezier(.4,0,.2,1);
  cursor:default;position:relative;overflow:hidden;
}
.tl-seg::after{content:'';position:absolute;inset:0;background:inherit;opacity:.15}
.tl-seg-1{background:rgba(99,179,237,.3);color:var(--c1);border-right:1px solid rgba(255,255,255,.06)}
.tl-seg-2{background:rgba(104,211,145,.3);color:var(--c2);border-right:1px solid rgba(255,255,255,.06)}
.tl-seg-3{background:rgba(246,173,85,.3);color:var(--c3)}
.tl-seg-invalid{background:rgba(255,255,255,.04);color:var(--mu)}
.tl-ages{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--mu)}

/* ── Period Cards ── */
.periods{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.pc{
  border-radius:22px;padding:26px;border:1px solid var(--b1);
  position:relative;overflow:hidden;
}
.pc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.pc-1{background:rgba(99,179,237,.06)}
.pc-1::before{background:linear-gradient(90deg,var(--c1),transparent)}
.pc-2{background:rgba(104,211,145,.06)}
.pc-2::before{background:linear-gradient(90deg,var(--c2),transparent)}
.pc-3{background:rgba(246,173,85,.06)}
.pc-3::before{background:linear-gradient(90deg,var(--c3),transparent)}
.pc-invalid{background:rgba(255,255,255,.02);opacity:.45}

.pc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.pc-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 14px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.07em;
}
.b1{background:rgba(99,179,237,.15);color:var(--c1);border:1px solid rgba(99,179,237,.3)}
.b2{background:rgba(104,211,145,.15);color:var(--c2);border:1px solid rgba(104,211,145,.3)}
.b3{background:rgba(246,173,85,.15);color:var(--c3);border:1px solid rgba(246,173,85,.3)}
.pc-range{font-size:13px;color:var(--mu)}
.pc-tag{font-size:11px;color:var(--mu);letter-spacing:.05em}

/* Annual big number */
.pc-annual{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.annual-wrap .al{font-size:11px;color:var(--mu);margin-bottom:6px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.annual-num{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1}
.annual-num .u{font-size:16px;font-weight:600;color:var(--mu);margin-left:4px}
.rate-chip{
  font-size:12px;color:var(--mu);
  background:rgba(255,255,255,.05);border:1px solid var(--b1);
  padding:5px 10px;border-radius:8px;
}

/* Bar breakdown */
.breakdown-bar{margin-bottom:18px}
.bb-label{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:8px}
.bb-track{height:10px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bb-fill{
  height:100%;border-radius:999px;
  transition:width .7s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.bb-fill::after{
  content:'';position:absolute;right:0;top:0;bottom:0;
  width:4px;background:rgba(255,255,255,.4);border-radius:999px;
}

/* Stats row */
.pc-stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{
  flex:1;min-width:120px;padding:12px 16px;border-radius:14px;
  background:rgba(255,255,255,.04);border:1px solid var(--b1);
}
.stat .sl{font-size:11px;color:var(--mu);margin-bottom:6px;font-weight:500}
.stat .sv{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sv-green{color:var(--green)}
.sv-1{color:var(--c1)}.sv-2{color:var(--c2)}.sv-3{color:var(--c3)}

/* ── Until Selector ── */
.total-card{
  background:var(--s1);border:1px solid var(--b1);
  border-radius:24px;padding:28px;
}
.until-title{font-size:22px;font-weight:800;margin-bottom:6px}
.until-sub{font-size:14px;color:var(--mu);margin-bottom:22px}

.until-opts{display:flex;flex-direction:column;gap:10px}
.u-opt{
  display:flex;align-items:center;gap:14px;
  padding:18px 20px;border:1px solid var(--b1);border-radius:16px;
  cursor:pointer;transition:all .2s;background:rgba(255,255,255,.02);
  position:relative;overflow:hidden;
}
.u-opt::after{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:99px;
  background:var(--cyan);transform:scaleX(0);transform-origin:left;transition:transform .2s;
}
.u-opt:hover{border-color:var(--b2);background:var(--s2)}
.u-opt.sel{border-color:rgba(79,209,197,.35);background:rgba(79,209,197,.07)}
.u-opt.sel::after{transform:scaleX(1)}
.u-radio{
  width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;
}
.u-opt.sel .u-radio{border-color:var(--cyan);background:rgba(79,209,197,.2)}
.u-dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);opacity:0;transition:opacity .15s}
.u-opt.sel .u-dot{opacity:1}
.u-text{flex:1;font-size:15px;font-weight:600}
.u-sub{font-size:12px;color:var(--mu);margin-top:2px;font-weight:400}
.u-amount{font-size:20px;font-weight:900;color:var(--cyan);letter-spacing:-.01em;text-align:right}
.u-amount-label{font-size:11px;color:var(--mu);text-align:right;font-weight:500}

/* ── Total Result Box ── */
#total-result{
  display:none;margin-top:20px;
  border-radius:18px;overflow:hidden;
}
#total-result.on{display:block;animation:fadeUp .3s ease}
.tr-inner{
  background:linear-gradient(135deg,rgba(79,209,197,.08),rgba(99,179,237,.06));
  border:1px solid rgba(79,209,197,.18);border-radius:18px;padding:24px;
}
.tr-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;font-size:14px;
}
.tr-row+.tr-row{border-top:1px solid rgba(255,255,255,.06)}
.tr-l{color:var(--mu)}
.tr-v{font-weight:700;font-size:16px}
.tr-v-green{color:var(--green)}
.tr-main{padding-top:18px;margin-top:8px;border-top:1px solid rgba(255,255,255,.12) !important}
.tr-main .tr-l{font-size:16px;font-weight:700;color:var(--tx)}
.tr-net{font-size:36px;font-weight:900;color:var(--cyan);letter-spacing:-.02em}

/* ── Disclaimer ── */
.disc{
  margin-top:16px;padding:18px 20px;
  background:rgba(255,255,255,.02);border-radius:14px;
  font-size:12px;line-height:2;color:var(--mu);
}

/* ── Animations ── */
@keyframes countUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.count-anim{animation:countUp .5s ease forwards}
</style>
</head>
<body>
<div class="page">

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-mark">FB</div>
    <div class="logo-info">
      <strong>重大傷病定期健康險</strong>
      <span>SDKA／SDKB 保費試算工具</span>
    </div>
  </div>
  <div class="badge">10 年期</div>
</header>

<!-- Input Card -->
<div class="card">
  <div class="section-label">基本資料</div>

  <!-- Gender -->
  <div class="gender-row">
    <label class="g-btn" id="lb-m" onclick="setGender('male')">
      <input type="radio" name="gender" value="male">
      <span class="g-icon">♂</span><span>男性</span>
    </label>
    <label class="g-btn" id="lb-f" onclick="setGender('female')">
      <input type="radio" name="gender" value="female">
      <span class="g-icon">♀</span><span>女性</span>
    </label>
  </div>

  <!-- Birth date -->
  <div class="field-label">出生日期</div>
  <div class="date-row">
    <input class="yr" type="number" id="by" placeholder="西元年" min="1930" max="2015" oninput="onDateChange()">
    <select class="mo" id="bm" onchange="onMonthChange();onDateChange()">
      <option value="">月</option>
      <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
      <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
      <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
      <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
    </select>
    <select class="dy" id="bd" onchange="onDateChange()">
      <option value="">日</option>
    </select>
  </div>
  <div id="age-tag">
    <span id="age-txt"></span>
  </div>

  <!-- Coverage Slider -->
  <div class="coverage-section">
    <div class="field-label">保額</div>
    <div class="coverage-top">
      <div>
        <div style="display:flex;align-items:flex-end;gap:4px">
          <input type="number" class="coverage-input" id="cov-num" value="100" min="10" max="1000" step="10" oninput="syncSlider(this.value);clearResults()">
          <span style="font-size:20px;font-weight:600;color:var(--mu);padding-bottom:8px">萬元</span>
        </div>
      </div>
      <div style="text-align:right;color:var(--mu);font-size:13px;line-height:2">
        <div>每年保費</div>
        <div id="preview-annual" style="font-size:20px;font-weight:800;color:var(--tx)">—</div>
      </div>
    </div>
    <div class="slider-wrap">
      <input type="range" id="cov-slider" min="10" max="1000" step="10" value="100"
             style="--pct:9.09%"
             oninput="syncNum(this.value)">
    </div>
    <div class="slider-ticks">
      <span class="slider-tick">10萬</span>
      <span class="slider-tick">250萬</span>
      <span class="slider-tick">500萬</span>
      <span class="slider-tick">750萬</span>
      <span class="slider-tick">1000萬</span>
    </div>
  </div>

  <button class="calc-btn" onclick="calculate()">開始試算</button>
  <div id="err"></div>
</div>

<!-- Results -->
<div class="results" id="results">

  <!-- Hero -->
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-label">試算對象</div>
        <div class="hero-who" id="hero-who"></div>
      </div>
      <div id="hero-meta" class="hero-meta"></div>
    </div>
    <div style="margin-bottom:20px">
      <div class="hero-label">三期合計淨支出（假設未理賠）</div>
      <div class="hero-big"><span class="cur">$</span><span id="hero-net">—</span></div>
    </div>

    <!-- Timeline -->
    <div class="timeline">
      <div class="tl-label">保障時間軸</div>
      <div class="tl-track" id="tl-track"></div>
      <div class="tl-ages" id="tl-ages"></div>
    </div>
  </div>

  <!-- Period Cards -->
  <div class="periods" id="period-cards"></div>

  <!-- Total Section -->
  <div class="total-card">
    <div class="until-title">我想繳到幾歲？</div>
    <div class="until-sub">選擇保障期間，計算您的總支出</div>
    <div class="until-opts" id="until-opts"></div>
    <div id="total-result">
      <div class="tr-inner">
        <div class="tr-row">
          <span class="tr-l">累計繳納保費</span>
          <span class="tr-v" id="t-paid"></span>
        </div>
        <div class="tr-row">
          <span class="tr-l">期滿退還（假設未理賠）</span>
          <span class="tr-v tr-v-green" id="t-refund"></span>
        </div>
        <div class="tr-row tr-main">
          <span class="tr-l">淨總支出</span>
          <span class="tr-net" id="t-net"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="disc">
    ※ 本試算以費率表資料為基礎，僅供參考，實際保費以富邦人壽核保結果為準。<br>
    ※「退還一年保費」為假設未發生理賠且完整繳足 10 年之情形。<br>
    ※ 費率單位：元／每萬元保額；新契約 (SDKA) 上限 61 歲；有效契約續保 (SDKB) 最高 71 歲。
  </div>
</div>
</div>

<script>

// ── Insurance Age ────────────────────────────────────────────────
function insAge(bDate,ref=new Date()){
  const b=new Date(bDate);
  let yr=ref.getFullYear()-b.getFullYear();
  const bt=new Date(ref.getFullYear(),b.getMonth(),b.getDate());
  const bn=new Date(ref.getFullYear()+1,b.getMonth(),b.getDate());
  const bl=new Date(ref.getFullYear()-1,b.getMonth(),b.getDate());
  let lo,hi;
  if(ref>=bt){lo=bt;hi=bn}else{yr--;lo=bl;hi=bt}
  return Math.floor(yr+(ref-lo)/(hi-lo)+0.5);
}

// ── Helpers ──────────────────────────────────────────────────────
function fmt(n){return Math.round(n).toLocaleString('zh-TW')}

let countTimers=[];
function countUp(el,target,dur=600){
  countTimers.forEach(clearInterval);countTimers=[];
  const start=Date.now();
  const t=setInterval(()=>{
    const p=Math.min((Date.now()-start)/dur,1);
    const ease=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(target*ease));
    if(p>=1){clearInterval(t);el.textContent=fmt(target)}
  },16);
  countTimers.push(t);
}

function setGender(g){
  document.querySelector(`input[value="${g}"]`).checked=true;
  document.getElementById('lb-m').className='g-btn'+(g==='male'?' male-on':'');
  document.getElementById('lb-f').className='g-btn'+(g==='female'?' female-on':'');
  clearResults();updatePreview();
}

function onMonthChange(){
  const y=+document.getElementById('by').value||2000;
  const m=+document.getElementById('bm').value;
  const sel=document.getElementById('bd');
  const prev=+sel.value;
  sel.innerHTML='<option value="">日</option>';
  if(!m)return;
  const days=new Date(y,m,0).getDate();
  for(let d=1;d<=days;d++){
    const o=document.createElement('option');
    o.value=d;o.textContent=d+'日';
    if(d===prev)o.selected=true;
    sel.appendChild(o);
  }
}

function onDateChange(){
  clearResults();
  const y=document.getElementById('by').value;
  const m=document.getElementById('bm').value;
  const d=document.getElementById('bd').value;
  if(!y||!m||!d){document.getElementById('age-tag').className='';return}
  const age=insAge(new Date(+y,+m-1,+d));
  const tag=document.getElementById('age-tag');
  document.getElementById('age-txt').textContent=`保險年齡 ${age} 歲`;
  tag.className='on';
  updatePreview();
}

function updatePreview(){
  const g=document.querySelector('input[name="gender"]:checked')?.value;
  const y=document.getElementById('by').value;
  const m=document.getElementById('bm').value;
  const d=document.getElementById('bd').value;
  const cov=+document.getElementById('cov-num').value;
  if(!g||!y||!m||!d||!cov)return;
  const age=insAge(new Date(+y,+m-1,+d));
  const rate=SDKA[g]?.[age];
  document.getElementById('preview-annual').textContent=
    rate?fmt(rate*cov)+' 元':'—';
}

// ── Slider Sync ──────────────────────────────────────────────────
function syncSlider(v){
  const sl=document.getElementById('cov-slider');
  const val=Math.min(Math.max(+v||10),1000);
  sl.value=val;
  const pct=((val-10)/(1000-10)*100).toFixed(2);
  sl.style.setProperty('--pct',pct+'%');
  updatePreview();
}
function syncNum(v){
  document.getElementById('cov-num').value=v;
  const pct=((v-10)/(1000-10)*100).toFixed(2);
  document.getElementById('cov-slider').style.setProperty('--pct',pct+'%');
  clearResults();updatePreview();
}

function clearResults(){
  const r=document.getElementById('results');
  r.className='results';
  document.getElementById('err').className='';
}

// ── Period Data ───────────────────────────────────────────────────
let PD=[];
const PS=[
  {cardC:'pc pc-1',badgeC:'pc-badge b1',vC:'sv-1',barC:'rgba(99,179,237,.7)',num:1},
  {cardC:'pc pc-2',badgeC:'pc-badge b2',vC:'sv-2',barC:'rgba(104,211,145,.7)',num:2},
  {cardC:'pc pc-3',badgeC:'pc-badge b3',vC:'sv-3',barC:'rgba(246,173,85,.7)', num:3},
];

function buildCard(p,i){
  const s=PS[i];
  if(!p.valid)return`<div class="pc pc-invalid" style="padding:22px">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="${s.badgeC}">第 ${i+1} 期</span>
      <span style="font-size:14px;color:var(--mu)">${p.as} 歲起・超出承保年齡範圍（最高 ${p.max} 歲）</span>
    </div></div>`;

  const netPct=Math.round((p.net/p.total10)*100);

  return`<div class="${s.cardC}">
    <div class="pc-head">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="${s.badgeC}">第 ${i+1} 期</span>
        <span class="pc-range">${p.as}～${p.as+9} 歲</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="rate-chip">費率 ${p.rate}/萬</span>
        <span class="pc-tag">${p.tbl}</span>
      </div>
    </div>

    <div class="pc-annual">
      <div class="annual-wrap">
        <div class="al">年繳保費</div>
        <div class="annual-num ${s.vC}" data-val="${p.annual}">
          <span class="num-val">${fmt(p.annual)}</span><span class="u">元</span>
        </div>
      </div>
    </div>

    <div class="breakdown-bar">
      <div class="bb-label">
        <span>10 年總繳：${fmt(p.total10)} 元</span>
        <span style="color:var(--green)">退還 ${fmt(p.refund)} 元（10%）</span>
      </div>
      <div class="bb-track">
        <div class="bb-fill" style="width:0%;background:${s.barC}" data-w="${netPct}"></div>
      </div>
    </div>

    <div class="pc-stats">
      <div class="stat">
        <div class="sl">10 年總繳</div>
        <div class="sv">${fmt(p.total10)} <span style="font-size:13px;font-weight:500;color:var(--mu)">元</span></div>
      </div>
      <div class="stat">
        <div class="sl">期滿退還</div>
        <div class="sv sv-green">＋${fmt(p.refund)} <span style="font-size:13px;font-weight:500;color:var(--mu)">元</span></div>
      </div>
      <div class="stat">
        <div class="sl">淨支出</div>
        <div class="sv ${s.vC}">${fmt(p.net)} <span style="font-size:13px;font-weight:500;color:var(--mu)">元</span></div>
      </div>
    </div>
  </div>`;
}

// ── Timeline ─────────────────────────────────────────────────────
function buildTimeline(age){
  const totNet=PD.reduce((s,p)=>s+(p.valid?p.net:0),0);
  const track=document.getElementById('tl-track');
  const ages=document.getElementById('tl-ages');

  const segs=PD.map((p,i)=>{
    const cls=p.valid?`tl-seg tl-seg-${i+1}`:'tl-seg tl-seg-invalid';
    const lbl=p.valid?`第${i+1}期`:'超齡';
    return`<div class="${cls}" style="flex:${p.valid?1:.3}" data-flex="${p.valid?1:.3}">${lbl}</div>`;
  });
  track.innerHTML=segs.join('');

  // Animate widths
  requestAnimationFrame(()=>{
    track.querySelectorAll('.tl-seg').forEach(el=>{
      el.style.flex=el.dataset.flex;
    });
  });

  const ageList=[age];
  PD.forEach(p=>{if(p.valid)ageList.push(p.as+10)});
  const lastValid=PD.filter(p=>p.valid).pop();
  ages.innerHTML=ageList.map(a=>`<span>${a} 歲</span>`).join('');
}

// ── Until Options ────────────────────────────────────────────────
function buildUntil(){
  const c=document.getElementById('until-opts');
  c.innerHTML='';
  PD.forEach((p,i)=>{
    if(!p.valid)return;
    let cumPaid=0,cumRefund=0;
    for(let j=0;j<=i;j++){if(PD[j].valid){cumPaid+=PD[j].total10;cumRefund+=PD[j].refund}}
    const cumNet=cumPaid-cumRefund;

    const div=document.createElement('div');
    div.className='u-opt';
    div.id=`uo-${i}`;
    div.innerHTML=`
      <div class="u-radio"><div class="u-dot"></div></div>
      <div style="flex:1">
        <div class="u-text">繳到 ${p.as+9} 歲（完成第 ${i+1} 期）</div>
        <div class="u-sub">累計 ${(i+1)*10} 年保障</div>
      </div>
      <div>
        <div class="u-amount-label">淨支出</div>
        <div class="u-amount">${fmt(cumNet)}</div>
      </div>`;
    div.onclick=()=>selectUntil(i,cumPaid,cumRefund,cumNet);
    c.appendChild(div);
  });
}

function selectUntil(idx,paid,refund,net){
  document.querySelectorAll('.u-opt').forEach((el,i)=>{
    el.classList.toggle('sel',i===idx);
  });
  document.getElementById('t-paid').textContent=fmt(paid)+' 元';
  document.getElementById('t-refund').textContent='＋'+fmt(refund)+' 元';
  document.getElementById('t-net').textContent=fmt(net)+' 元';
  const tr=document.getElementById('total-result');
  tr.style.display='block';
  tr.className='on';
}

// ── Main Calculate ────────────────────────────────────────────────
function calculate(){
  const g=document.querySelector('input[name="gender"]:checked')?.value;
  const y=document.getElementById('by').value;
  const m=document.getElementById('bm').value;
  const d=document.getElementById('bd').value;
  const cov=parseFloat(document.getElementById('cov-num').value);

  const errEl=document.getElementById('err');
  errEl.className='';

  if(!g){showErr('請選擇性別');return}
  if(!y||!m||!d){showErr('請完整填寫出生日期');return}
  if(!cov||cov<=0){showErr('請輸入有效保額');return}
  if(+y<1930||+y>2015){showErr('請輸入合理的出生年份');return}

  const bDate=new Date(+y,+m-1,+d);
  const age=insAge(bDate);

  if(age<15){showErr(`保險年齡 ${age} 歲，未達最低投保年齡（15 歲）`);return}
  if(age>61){showErr(`保險年齡 ${age} 歲，已超過 SDKA 新契約最高投保年齡（61 歲）`);return}

  const defs=[
    {tbl:'SDKA 新契約',as:age,    rt:SDKA,max:61},
    {tbl:'SDKB 續保',  as:age+10, rt:SDKB,max:71},
    {tbl:'SDKB 續保',  as:age+20, rt:SDKB,max:71},
  ];
  PD=defs.map(def=>{
    const rate=def.rt[g]?.[def.as];
    if(!rate||def.as>def.max)return{valid:false,as:def.as,max:def.max};
    const annual=rate*cov;
    return{valid:true,as:def.as,tbl:def.tbl,rate,annual,total10:annual*10,refund:annual,net:annual*9};
  });

  // Hero
  const totalNet=PD.reduce((s,p)=>s+(p.valid?p.net:0),0);
  const validCt=PD.filter(p=>p.valid).length;
  document.getElementById('hero-who').textContent=
    `${g==='male'?'男性':'女性'}・保險年齡 ${age} 歲・保額 ${fmt(cov)} 萬元`;
  document.getElementById('hero-meta').innerHTML=
    `<strong>${validCt}</strong> 個期間<br>合計 <strong>${validCt*10}</strong> 年保障`;

  // Render
  document.getElementById('period-cards').innerHTML=PD.map(buildCard).join('');
  buildTimeline(age);
  buildUntil();
  document.getElementById('total-result').className='';
  document.getElementById('total-result').style.display='none';

  // Show results
  const r=document.getElementById('results');
  r.style.display='block';
  requestAnimationFrame(()=>{
    r.className='results on';
    r.scrollIntoView({behavior:'smooth',block:'start'});
  });

  // Animate hero number
  const heroEl=document.getElementById('hero-net');
  countUp(heroEl,totalNet,700);

  // Animate bars after cards render
  setTimeout(()=>{
    document.querySelectorAll('.bb-fill').forEach(el=>{
      el.style.width=el.dataset.w+'%';
    });
  },100);
}

function showErr(msg){
  const el=document.getElementById('err');
  el.textContent=msg;el.className='on';el.style.display='block';
}
</script>
