<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富邦 SDKA/SDKB 重大傷病險保費試算</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fubon: {
              blue: '#003087',
              light: '#0050b3',
              pale: '#e6eef8',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .card-enter { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-fubon-blue text-white py-5 px-4 shadow-lg">
    <div class="max-w-2xl mx-auto">
      <p class="text-xs text-blue-200 mb-1">富邦人壽醫靠安心</p>
      <h1 class="text-xl font-bold leading-snug">重大傷病定期健康險</h1>
      <p class="text-sm text-blue-200 mt-1">SDKA／SDKB 保費試算工具</p>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">

    <!-- Input Card -->
    <section class="bg-white rounded-2xl shadow-sm p-6 space-y-5">
      <h2 class="text-base font-semibold text-gray-700 border-b pb-3">基本資料</h2>

      <!-- Gender -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-2">性別</label>
        <div class="flex gap-3">
          <label class="flex-1 flex items-center justify-center gap-2 border-2 rounded-xl py-3 cursor-pointer transition-all"
                 id="label-male">
            <input type="radio" name="gender" value="male" class="hidden" onchange="updateGenderUI()">
            <span class="text-lg">♂</span><span class="font-medium">男性</span>
          </label>
          <label class="flex-1 flex items-center justify-center gap-2 border-2 rounded-xl py-3 cursor-pointer transition-all"
                 id="label-female">
            <input type="radio" name="gender" value="female" class="hidden" onchange="updateGenderUI()">
            <span class="text-lg">♀</span><span class="font-medium">女性</span>
          </label>
        </div>
      </div>

      <!-- Birth Date -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-2">出生日期</label>
        <div class="flex gap-2">
          <div class="flex-1">
            <input type="number" id="birth-year" placeholder="年（西元）"
                   class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-fubon-blue focus:ring-2 focus:ring-fubon-pale"
                   min="1930" max="2015" oninput="clearResults()">
          </div>
          <div class="w-20">
            <select id="birth-month"
                    class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-fubon-blue bg-white" onchange="clearResults()">
              <option value="">月</option>
              <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
              <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
              <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
              <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
            </select>
          </div>
          <div class="w-20">
            <select id="birth-day"
                    class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-fubon-blue bg-white" onchange="clearResults()">
              <option value="">日</option>
            </select>
          </div>
        </div>
        <p id="age-display" class="text-sm text-fubon-blue mt-2 font-medium hidden"></p>
      </div>

      <!-- Coverage Amount -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-2">保額</label>
        <div class="relative">
          <input type="number" id="coverage" placeholder="例：100"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 pr-16 text-sm focus:outline-none focus:border-fubon-blue focus:ring-2 focus:ring-fubon-pale"
                 min="1" oninput="clearResults()">
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-gray-400">萬元</span>
        </div>
        <p class="text-xs text-gray-400 mt-1">請輸入整數萬元，最低投保單位依各險種規定</p>
      </div>

      <!-- Calculate Button -->
      <button onclick="calculate()"
              class="w-full bg-fubon-blue hover:bg-fubon-light text-white font-semibold py-4 rounded-xl transition-colors text-base shadow-md active:scale-95">
        開始試算
      </button>

      <!-- Error Message -->
      <p id="error-msg" class="text-red-500 text-sm text-center hidden"></p>
    </section>

    <!-- Results -->
    <section id="results" class="hidden space-y-4 card-enter">

      <!-- Summary Bar -->
      <div class="bg-fubon-blue text-white rounded-2xl p-5">
        <p class="text-sm text-blue-200">試算結果</p>
        <p id="result-summary" class="text-lg font-bold mt-1"></p>
      </div>

      <!-- Period Cards -->
      <div id="period-cards" class="space-y-3"></div>

      <!-- Total Calculator -->
      <div class="bg-white rounded-2xl shadow-sm p-6">
        <h3 class="text-base font-semibold text-gray-700 border-b pb-3 mb-4">我想繳到幾歲？</h3>
        <div id="until-options" class="space-y-2 mb-5"></div>
        <div id="total-result" class="hidden bg-fubon-pale rounded-xl p-4 space-y-3">
          <div class="flex justify-between text-sm">
            <span class="text-gray-600">累計繳納保費</span>
            <span id="total-paid" class="font-semibold text-gray-800"></span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-600">累計退還（假設未理賠）</span>
            <span id="total-refund" class="font-semibold text-green-600"></span>
          </div>
          <div class="border-t pt-3 flex justify-between">
            <span class="font-semibold text-gray-800">淨總支出</span>
            <span id="total-net" class="text-xl font-bold text-fubon-blue"></span>
          </div>
        </div>
      </div>

      <!-- Disclaimer -->
      <p class="text-xs text-gray-400 px-1">
        ※ 本試算以費率表資料為基礎，僅供參考，實際保費以富邦人壽核保結果為準。<br>
        ※ 「退還一年保費」為假設未發生理賠且完整繳足10年之情形。<br>
        ※ 費率單位：元/每萬元保額；繳費期間：10年期。<br>
        ※ 新契約(SDKA)投保年齡上限61歲；有效契約續保(SDKB)最高至71歲。
      </p>
    </section>

  </main>

  <script>
    // ── Rate Tables ──────────────────────────────────────────────
    const SDKA = {
      male: {
        15:51,16:53,17:56,18:57,19:58,20:59,
        21:62,22:65,23:68,24:70,25:73,26:77,27:79,28:83,29:86,30:91,
        31:98,32:106,33:114,34:123,35:132,36:140,37:147,38:157,39:168,40:181,
        41:198,42:218,43:238,44:257,45:277,46:296,47:315,48:336,49:355,50:377,
        51:412,52:448,53:485,54:518,55:555,56:589,57:624,58:658,59:692,60:730,
        61:768
      },
      female: {
        15:40,16:43,17:46,18:49,19:52,20:55,
        21:58,22:60,23:63,24:66,25:69,26:72,27:76,28:80,29:84,30:88,
        31:96,32:104,33:113,34:122,35:130,36:138,37:146,38:156,39:164,40:171,
        41:183,42:198,43:213,44:229,45:243,46:259,47:275,48:291,49:311,50:328,
        51:343,52:363,53:383,54:403,55:424,56:445,57:467,58:488,59:511,60:537,
        61:570
      }
    };

    const SDKB = {
      male: {
        25:78,26:82,27:85,28:89,29:92,30:97,
        31:104,32:113,33:122,34:130,35:138,36:147,37:156,38:165,39:177,40:192,
        41:214,42:237,43:261,44:281,45:303,46:325,47:347,48:370,49:390,50:412,
        51:448,52:487,53:526,54:560,55:602,56:638,57:675,58:713,59:750,60:785,
        61:834,62:884,63:934,64:991,65:1048,66:1100,67:1157,68:1212,69:1269,70:1331,
        71:1403
      },
      female: {
        25:75,26:79,27:82,28:87,29:91,30:96,
        31:103,32:112,33:121,34:129,35:137,36:146,37:154,38:164,39:175,40:185,
        41:200,42:215,43:232,44:250,45:267,46:286,47:304,48:324,49:344,50:361,
        51:381,52:400,53:419,54:442,55:464,56:487,57:510,58:534,59:564,60:597,
        61:634,62:675,63:723,64:771,65:819,66:867,67:913,68:963,69:1016,70:1060,
        71:1116
      }
    };

    // ── Insurance Age Calculation ─────────────────────────────────
    function calcInsuranceAge(birthDate, refDate = new Date()) {
      const b = new Date(birthDate);
      // birthdate this year relative to refDate
      let yearDiff = refDate.getFullYear() - b.getFullYear();
      const bdThisYear = new Date(refDate.getFullYear(), b.getMonth(), b.getDate());
      const bdNextYear = new Date(refDate.getFullYear() + 1, b.getMonth(), b.getDate());
      const bdLastYear = new Date(refDate.getFullYear() - 1, b.getMonth(), b.getDate());

      let lastBd, nextBd;
      if (refDate >= bdThisYear) {
        lastBd = bdThisYear;
        nextBd = bdNextYear;
      } else {
        yearDiff--;
        lastBd = bdLastYear;
        nextBd = bdThisYear;
      }

      const daysPast = (refDate - lastBd);
      const yearLen = (nextBd - lastBd);
      const fracYear = daysPast / yearLen;

      return Math.floor(yearDiff + fracYear + 0.5);
    }

    // ── UI Helpers ────────────────────────────────────────────────
    function fmt(n) { return Math.round(n).toLocaleString('zh-TW'); }

    function updateGenderUI() {
      const male = document.querySelector('input[value="male"]').checked;
      document.getElementById('label-male').className =
        'flex-1 flex items-center justify-center gap-2 border-2 rounded-xl py-3 cursor-pointer transition-all ' +
        (male ? 'border-fubon-blue bg-fubon-pale text-fubon-blue' : 'border-gray-200 text-gray-500');
      document.getElementById('label-female').className =
        'flex-1 flex items-center justify-center gap-2 border-2 rounded-xl py-3 cursor-pointer transition-all ' +
        (!male ? 'border-pink-400 bg-pink-50 text-pink-600' : 'border-gray-200 text-gray-500');
      clearResults();
    }

    function clearResults() {
      document.getElementById('results').classList.add('hidden');
      document.getElementById('error-msg').classList.add('hidden');
    }

    // Populate days in birth-day select
    document.getElementById('birth-month').addEventListener('change', function() {
      const y = +document.getElementById('birth-year').value || 2000;
      const m = +this.value;
      const daysSel = document.getElementById('birth-day');
      const prev = +daysSel.value;
      daysSel.innerHTML = '<option value="">日</option>';
      if (!m) return;
      const days = new Date(y, m, 0).getDate();
      for (let d = 1; d <= days; d++) {
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = d + '日';
        if (d === prev) opt.selected = true;
        daysSel.appendChild(opt);
      }
    });

    // ── Period Data ───────────────────────────────────────────────
    let periodData = [];

    function buildPeriodCard(p, idx) {
      const colors = [
        { bg: 'bg-blue-50', border: 'border-blue-200', label: 'text-fubon-blue', badge: 'bg-fubon-blue' },
        { bg: 'bg-indigo-50', border: 'border-indigo-200', label: 'text-indigo-700', badge: 'bg-indigo-600' },
        { bg: 'bg-violet-50', border: 'border-violet-200', label: 'text-violet-700', badge: 'bg-violet-600' },
      ];
      const c = colors[idx];

      if (!p.valid) {
        return `
          <div class="${c.bg} border ${c.border} rounded-2xl p-5">
            <div class="flex items-center gap-3 mb-2">
              <span class="${c.badge} text-white text-xs px-2 py-1 rounded-full font-medium">第${idx+1}期</span>
              <span class="text-sm text-gray-500">${p.ageStart} 歲起</span>
            </div>
            <p class="text-gray-400 text-sm">超出承保年齡範圍（最高 ${p.maxAge} 歲）</p>
          </div>`;
      }

      return `
        <div class="${c.bg} border ${c.border} rounded-2xl p-5">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
              <span class="${c.badge} text-white text-xs px-2 py-1 rounded-full font-medium">第${idx+1}期</span>
              <span class="text-sm text-gray-500">${p.ageStart}～${p.ageStart+9} 歲</span>
            </div>
            <span class="text-xs text-gray-400">${p.table}</span>
          </div>
          <div class="space-y-2">
            <div class="flex justify-between text-sm">
              <span class="text-gray-600">費率（${p.ageStart}歲）</span>
              <span class="font-medium">${p.rate} 元/萬元</span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-gray-600">年繳保費</span>
              <span class="font-semibold ${c.label}">${fmt(p.annual)} 元</span>
            </div>
            <div class="flex justify-between text-sm border-t pt-2">
              <span class="text-gray-600">10 年總繳</span>
              <span class="font-semibold">${fmt(p.total10)} 元</span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-gray-600">期滿退還（未理賠）</span>
              <span class="font-semibold text-green-600">＋${fmt(p.refund)} 元</span>
            </div>
            <div class="flex justify-between border-t pt-2">
              <span class="font-semibold text-gray-700">淨支出</span>
              <span class="text-xl font-bold ${c.label}">${fmt(p.net)} 元</span>
            </div>
          </div>
        </div>`;
    }

    // ── Until-Age Selector ────────────────────────────────────────
    function buildUntilOptions(entryAge) {
      const container = document.getElementById('until-options');
      container.innerHTML = '';

      const options = [];
      for (let i = 0; i < 3; i++) {
        const p = periodData[i];
        if (p && p.valid) {
          options.push({ label: `繳到 ${p.ageStart + 9} 歲（完成第${i+1}期）`, periods: i + 1 });
        }
      }

      if (options.length === 0) return;

      options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.innerHTML = `
          <label class="flex items-center gap-3 p-3 rounded-xl border-2 border-gray-200 cursor-pointer hover:border-fubon-blue transition-all">
            <input type="radio" name="until" value="${i}" class="text-fubon-blue" onchange="calcTotal(${i})">
            <span class="text-sm text-gray-700">${opt.label}</span>
          </label>`;
        container.appendChild(div);
      });
    }

    function calcTotal(periodIdx) {
      let totalPaid = 0, totalRefund = 0;
      for (let i = 0; i <= periodIdx; i++) {
        const p = periodData[i];
        if (p && p.valid) {
          totalPaid += p.total10;
          totalRefund += p.refund;
        }
      }
      document.getElementById('total-paid').textContent = fmt(totalPaid) + ' 元';
      document.getElementById('total-refund').textContent = '＋' + fmt(totalRefund) + ' 元';
      document.getElementById('total-net').textContent = fmt(totalPaid - totalRefund) + ' 元';
      document.getElementById('total-result').classList.remove('hidden');
    }

    // ── Main Calculate ────────────────────────────────────────────
    function calculate() {
      const gender = document.querySelector('input[name="gender"]:checked')?.value;
      const y = document.getElementById('birth-year').value;
      const m = document.getElementById('birth-month').value;
      const d = document.getElementById('birth-day').value;
      const coverage = parseFloat(document.getElementById('coverage').value);

      const err = document.getElementById('error-msg');
      err.classList.add('hidden');

      if (!gender) { showErr('請選擇性別'); return; }
      if (!y || !m || !d) { showErr('請完整填寫出生日期'); return; }
      if (!coverage || coverage <= 0) { showErr('請輸入有效保額'); return; }
      if (+y < 1930 || +y > 2015) { showErr('請輸入合理的出生年份'); return; }

      const birthDate = new Date(+y, +m - 1, +d);
      const today = new Date();
      const insAge = calcInsuranceAge(birthDate, today);

      if (insAge < 15) { showErr(`保險年齡 ${insAge} 歲，未達最低投保年齡（15歲）`); return; }
      if (insAge > 61) { showErr(`保險年齡 ${insAge} 歲，已超過 SDKA 新契約最高投保年齡（61歲）`); return; }

      // Display insurance age
      document.getElementById('age-display').textContent =
        `保險年齡：${insAge} 歲`;
      document.getElementById('age-display').classList.remove('hidden');

      const units = coverage; // coverage in 萬元, rate is per 萬元

      // Build 3 periods
      periodData = [];
      const periods = [
        { table: 'SDKA（新契約）', ageStart: insAge, rateTable: SDKA, maxAge: 61 },
        { table: 'SDKB（續保）',   ageStart: insAge + 10, rateTable: SDKB, maxAge: 71 },
        { table: 'SDKB（續保）',   ageStart: insAge + 20, rateTable: SDKB, maxAge: 71 },
      ];

      periods.forEach((def) => {
        const rate = def.rateTable[gender][def.ageStart];
        if (!rate || def.ageStart > def.maxAge) {
          periodData.push({ valid: false, ageStart: def.ageStart, maxAge: def.maxAge });
        } else {
          const annual = rate * units;
          periodData.push({
            valid: true,
            ageStart: def.ageStart,
            table: def.table,
            rate,
            annual,
            total10: annual * 10,
            refund: annual,
            net: annual * 9,
          });
        }
      });

      // Render period cards
      document.getElementById('period-cards').innerHTML =
        periodData.map((p, i) => buildPeriodCard(p, i)).join('');

      // Summary
      document.getElementById('result-summary').textContent =
        `${gender === 'male' ? '男性' : '女性'}・保險年齡 ${insAge} 歲・保額 ${fmt(coverage)} 萬元`;

      // Until-age options
      buildUntilOptions(insAge);
      document.getElementById('total-result').classList.add('hidden');

      // Show results
      document.getElementById('results').classList.remove('hidden');
      document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function showErr(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
  </script>

</body>
</html>
